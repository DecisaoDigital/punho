name: Release Punho

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PUNHO_CERT_SHA256: 33386ff0dd95bb57818aaabc32b37e378da9febb1fb905b2388c4b5aa0f70205
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode release keystore
        # Secret PUNHO_KEYSTORE_BASE64 = base64 de D:\Seguro\keystores\punho_release.jks
        # Secret PUNHO_KEYSTORE_PASSWORD = senha da keystore
        # Ambas configuradas em Settings > Secrets > Actions do repo.
        env:
          KEYSTORE_B64: ${{ secrets.PUNHO_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.PUNHO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Secret PUNHO_KEYSTORE_BASE64 em falta}"
          : "${KEYSTORE_PW:?Secret PUNHO_KEYSTORE_PASSWORD em falta}"
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/punho_release.jks
          test -s android/app/punho_release.jks
          cat > android/key.properties << EOF
          storeFile=punho_release.jks
          storePassword=$KEYSTORE_PW
          keyAlias=punho
          keyPassword=$KEYSTORE_PW
          EOF
          chmod 600 android/app/punho_release.jks android/key.properties
          echo "Keystore de release configurada."
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get version
        id: version
        # Por tag usa-se a tag; por dispatch manual não há tag nenhuma e o
        # `GITHUB_REF_NAME` traz o nome da branch — que tem barras e rebentava o
        # nome do ficheiro do APK. Nesse caso lê-se a versão do pubspec, que é a
        # fonte de verdade de qualquer maneira.
        run: |
          set -euo pipefail
          pubspec_versao="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            versao="${GITHUB_REF_NAME#v}"
            if [ "$versao" != "$pubspec_versao" ]; then
              echo "::error::Tag $versao não coincide com pubspec $pubspec_versao"
              exit 1
            fi
          else
            versao="$pubspec_versao"
          fi
          [[ "$versao" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$versao" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter analyze
      # Goldens excluídos: dependem das fontes do sistema onde foram gerados
      # (Windows). No Ubuntu do CI o rendering difere e os pixels não batem —
      # são documentação para revisão humana, não gate de release (#202).
      - run: flutter test --exclude-tags=screenshot
      - name: Build split and universal APKs
        run: |
          set -euo pipefail
          versao="${{ steps.version.outputs.version }}"

          # Os APKs split ficam pequenos para instalações manuais específicas.
          flutter build apk --release --split-per-abi \
            --build-name="$versao" \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "Punho_v${versao}_armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "Punho_v${versao}_arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "Punho_v${versao}_x86_64.apk"

          # O catálogo Supabase tem um único URL Android. O APK universal é o
          # instalador recomendado e funciona em todas as arquiteturas.
          flutter build apk --release \
            --build-name="$versao" \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          cp build/app/outputs/flutter-apk/app-release.apk \
            "Punho_v${versao}_universal.apk"

          ls -lh Punho_v*.apk
      - name: Guard-rail — pacote, versão e assinatura definitiva
        run: |
          set -euo pipefail
          versao="${{ steps.version.outputs.version }}"
          apk="Punho_v${versao}_universal.apk"
          build="$(grep -m1 '^version:' pubspec.yaml | sed 's/.*+//')"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt"

          cert_output="$("$apksigner" verify --print-certs "$apk")"
          cert="$(printf '%s\n' "$cert_output" |
            awk -F ': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}')"
          if [ "$cert" != "$PUNHO_CERT_SHA256" ]; then
            echo "::error::Certificado de assinatura inesperado: $cert"
            exit 1
          fi

          badging="$("$aapt" dump badging "$apk" | head -n 1)"
          grep -F "name='com.example.punho'" <<< "$badging"
          grep -F "versionName='$versao'" <<< "$badging"
          grep -F "versionCode='$build'" <<< "$badging"
          echo "Pacote, versão e certificado definitivos confirmados."
      - name: Guard-rail — APK contem dart-defines Supabase
        # A v0.0.5 saiu sem SUPABASE_URL/ANON_KEY no APK e o auto-update ficou
        # mudo. Este step le libapp.so (onde as constantes ficam no AOT) e falha
        # o CI se os hostname/chave nao aparecerem. Ver task #210/#236.
        run: |
          set -eu
          apk="Punho_v${{ steps.version.outputs.version }}_arm64-v8a.apk"
          # A libapp.so e' o mesmo Dart AOT em todos os 3 APKs; verificar um chega.
          unzip -p "$apk" lib/arm64-v8a/libapp.so > /tmp/libapp.so
          if ! grep -aoE "supabase\.co" /tmp/libapp.so > /dev/null; then
            echo "::error::libapp.so nao contem supabase.co — dart-defines em falta!"
            exit 1
          fi
          echo "libapp.so contem strings Supabase (defines OK)"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Punho_v*.apk

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pubspec_versao="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            versao="${GITHUB_REF_NAME#v}"
            if [ "$versao" != "$pubspec_versao" ]; then
              echo "::error::Tag $versao não coincide com pubspec $pubspec_versao"
              exit 1
            fi
          else
            versao="$pubspec_versao"
          fi
          [[ "$versao" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$versao" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter test --exclude-tags=screenshot
      - shell: pwsh
        run: |
          flutter build windows --release `
            --build-name=${{ steps.version.outputs.version }} `
            --dart-define=SUPABASE_URL=$env:SUPABASE_URL `
            --dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY
      - name: Verify Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\punho_setup.iss
      - name: Rename installer
        shell: pwsh
        run: |
          $src = "installer_output\Punho_Setup_v${{ steps.version.outputs.version }}.exe"
          $dst = "Punho_Setup_v${{ steps.version.outputs.version }}.exe"
          if ($src -ne $dst) { Move-Item -Path $src -Destination $dst }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Punho_Setup_v${{ steps.version.outputs.version }}.exe

  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    # Só por tag. Um dispatch manual serve para validar que compila, testa e
    # assina — e tem de poder correr sem publicar nada. Sem esta guarda, o
    # dry-run criava um release com o nome da branch.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/*.apk
            artifacts/windows-installer/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
