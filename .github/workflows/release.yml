name: Release Punho

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get version
        id: version
        # Por tag usa-se a tag; por dispatch manual não há tag nenhuma e o
        # `GITHUB_REF_NAME` traz o nome da branch — que tem barras e rebentava o
        # nome do ficheiro do APK. Nesse caso lê-se a versão do pubspec, que é a
        # fonte de verdade de qualquer maneira.
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            versao="${GITHUB_REF_NAME#v}"
          else
            versao="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          echo "version=$versao" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      # Goldens excluídos: dependem das fontes do sistema onde foram gerados
      # (Windows). No Ubuntu do CI o rendering difere e os pixels não batem —
      # são documentação para revisão humana, não gate de release (#202).
      - run: flutter test --exclude-tags=screenshot
      - run: |
          # --split-per-abi: gera 3 APKs (arm64-v8a, armeabi-v7a, x86_64) em
          # vez de um fat APK com as 3 arquitecturas. A partir de compileSdk
          # 36 as libs .so ficam Stored (0% compressao) para memory-mapping;
          # o fat APK dobrou de 33 -> 69 MB entre v0.0.5 e v0.0.6 por essa
          # razao (task #209). Com split, cada APK volta a ~29 MB.
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.version.outputs.version }} \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      - name: Copy APKs to workspace root
        # applicationVariants.all no build.gradle.kts ja renomeia para
        # Punho_v{versao}_{abi}.apk. Aqui so movemos para o workspace root
        # para o glob do upload-artifact apanhar.
        run: |
          cp build/app/outputs/apk/release/Punho_v*.apk build/app/outputs/flutter-apk/Punho_v*.apk . 2>/dev/null; ls -la build/app/outputs/apk/release/ 2>/dev/null; ls -la build/app/outputs/flutter-apk/ 2>/dev/null; cp build/app/outputs/apk/release/*.apk . 2>/dev/null || cp build/app/outputs/flutter-apk/*.apk .
          ls -lh Punho_v*.apk
      - name: Guard-rail — APK contem dart-defines Supabase
        # A v0.0.5 saiu sem SUPABASE_URL/ANON_KEY no APK e o auto-update ficou
        # mudo. Este step le libapp.so (onde as constantes ficam no AOT) e falha
        # o CI se os hostname/chave nao aparecerem. Ver task #210/#236.
        run: |
          set -eu
          apk="Punho_v${{ steps.version.outputs.version }}_arm64-v8a.apk"
          # A libapp.so e' o mesmo Dart AOT em todos os 3 APKs; verificar um chega.
          unzip -p "$apk" lib/arm64-v8a/libapp.so > /tmp/libapp.so
          if ! grep -aoE "supabase\.co" /tmp/libapp.so > /dev/null; then
            echo "::error::libapp.so nao contem supabase.co — dart-defines em falta!"
            exit 1
          fi
          echo "libapp.so contem strings Supabase (defines OK)"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Punho_v*.apk

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            versao="${GITHUB_REF_NAME#v}"
          else
            versao="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          echo "version=$versao" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter test --exclude-tags=screenshot
      - shell: pwsh
        run: |
          flutter build windows --release `
            --build-name=${{ steps.version.outputs.version }} `
            --dart-define=SUPABASE_URL=$env:SUPABASE_URL `
            --dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY
      - name: Verify Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\punho_setup.iss
      - name: Rename installer
        shell: pwsh
        run: |
          $src = "installer_output\Punho_Setup_v${{ steps.version.outputs.version }}.exe"
          $dst = "Punho_Setup_v${{ steps.version.outputs.version }}.exe"
          if ($src -ne $dst) { Move-Item -Path $src -Destination $dst }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Punho_Setup_v${{ steps.version.outputs.version }}.exe

  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    # Só por tag. Um dispatch manual serve para validar que compila, testa e
    # assina — e tem de poder correr sem publicar nada. Sem esta guarda, o
    # dry-run criava um release com o nome da branch.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/*.apk
            artifacts/windows-installer/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
