name: Release Punho

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode release keystore
        # Secret PUNHO_KEYSTORE_BASE64 = base64 de D:\Seguro\keystores\punho_release.jks
        # Secret PUNHO_KEYSTORE_PASSWORD = senha da keystore
        # Ambas configuradas em Settings > Secrets > Actions do repo.
        env:
          KEYSTORE_B64: ${{ secrets.PUNHO_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.PUNHO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/punho_release.jks
            cat > android/key.properties << EOF
          storeFile=punho_release.jks
          storePassword=$KEYSTORE_PW
          keyAlias=punho
          keyPassword=$KEYSTORE_PW
          EOF
            echo "Keystore + key.properties criados. Release APK sera assinado."
          else
            echo "::warning::PUNHO_KEYSTORE_BASE64 nao configurado. APK sai com debug key."
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get version
        id: version
        # Por tag usa-se a tag; por dispatch manual não há tag nenhuma e o
        # `GITHUB_REF_NAME` traz o nome da branch — que tem barras e rebentava o
        # nome do ficheiro do APK. Nesse caso lê-se a versão do pubspec, que é a
        # fonte de verdade de qualquer maneira.
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            versao="${GITHUB_REF_NAME#v}"
          else
            versao="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          echo "version=$versao" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      # Goldens excluídos: dependem das fontes do sistema onde foram gerados
      # (Windows). No Ubuntu do CI o rendering difere e os pixels não batem —
      # são documentação para revisão humana, não gate de release (#202).
      - run: flutter test --exclude-tags=screenshot
      - run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version }} \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      - name: Rename APK
        # Da versão e não do `ref_name`: numa dispatch manual o `ref_name` é o
        # nome da branch, e `punho-android-feat/v006-boas-vindas.apk` não é um
        # caminho válido. Assim o nome sai igual nos dois casos.
        run: mv build/app/outputs/flutter-apk/app-release.apk punho-android-v${{ steps.version.outputs.version }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: punho-android-v${{ steps.version.outputs.version }}.apk

  # build-windows removido nesta fase — o Punho hoje é uma app mobile e o
  # tempo de runner windows-latest não é gratuito. Quando fizer sentido
  # voltar a distribuir build Windows, recuperar do histórico deste
  # ficheiro (última versão activa em 3368cbc/e73b678). Ver task no
  # backlog Cowork.

  release:
    name: Publish GitHub Release
    needs: [build-android]
    # Só por tag. Um dispatch manual serve para validar que compila, testa e
    # assina — e tem de poder correr sem publicar nada. Sem esta guarda, o
    # dry-run criava um release com o nome da branch.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
