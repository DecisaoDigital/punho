name: Release Punho

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter test
      - run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version }} \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk punho-android-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: punho-android-${{ github.ref_name }}.apk

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter test
      - shell: pwsh
        run: |
          flutter build windows --release `
            --build-name=${{ steps.version.outputs.version }} `
            --dart-define=SUPABASE_URL=$env:SUPABASE_URL `
            --dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY
      - name: Verify Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\punho_setup.iss
      - name: Rename installer
        shell: pwsh
        run: |
          $src = "installer_output\Punho_Setup_v${{ steps.version.outputs.version }}.exe"
          $dst = "Punho_Setup_${{ github.ref_name }}.exe"
          Move-Item -Path $src -Destination $dst
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Punho_Setup_${{ github.ref_name }}.exe

  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/*.apk
            artifacts/windows-installer/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
